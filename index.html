<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Janhavi — 3D Adventurer Odyssey</title>
  
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Minimal Clay Stylesheet -->
  <link rel="stylesheet" href="style.css">

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Fullscreen 3D Viewport -->
  <main id="world-viewport">
    <canvas id="world-canvas"></canvas>
  </main>

  <!-- Minimal HUD Header (Top Left) -->
  <header class="hud-header">
    <div class="hud-title-badge">
      <div class="hud-title">
        <span>🚶</span>
        <span>Janhavi</span>
      </div>
      <div class="hud-subtitle">Walk to milestone buildings or click them for details</div>
    </div>
  </header>

  <!-- Minimal Controls Pill (Top Right) -->
  <aside class="hud-controls-pill">
    <div class="control-badge">
      <span>🎮</span>
      <span>[W, A, S, D] or Arrow Keys to Walk</span>
    </div>
    <button id="reset-char-btn" class="reset-car-btn" title="Reset Adventurer to Start">
      <span>↺ Reset</span>
    </button>
  </aside>

  <!-- Small Minimal Milestone Popup (Anchored directly over clicked building) -->
  <div id="milestone-popup-container" class="milestone-popup-container">
    <div class="milestone-popup-card">
      <button id="popup-close-btn" class="popup-close-btn" aria-label="Close popup">✕</button>
      <span id="popup-step-badge" class="popup-step-badge">Milestone #1</span>
      <h2 id="popup-title" class="popup-title">Building Title</h2>
      <div id="popup-location" class="popup-location">Period • Location</div>
      <p id="popup-summary" class="popup-summary">Summary text goes here.</p>
      <div id="popup-tags" class="popup-tags"></div>
    </div>
  </div>

  <!-- Mobile On-Screen Steering & Pedals -->
  <div class="mobile-touch-steering md:hidden">
    <button id="touch-steer-left" class="touch-pedal-btn" aria-label="Turn Left">
      <span>◀</span>
      <span class="pedal-label">Left</span>
    </button>
    <button id="touch-steer-right" class="touch-pedal-btn" aria-label="Turn Right">
      <span>▶</span>
      <span class="pedal-label">Right</span>
    </button>
  </div>

  <div class="mobile-touch-pedals md:hidden">
    <button id="touch-pedal-walk" class="touch-pedal-btn" aria-label="Walk Forward">
      <span>▲</span>
      <span class="pedal-label">Walk</span>
    </button>
    <button id="touch-pedal-back" class="touch-pedal-btn" aria-label="Walk Backward">
      <span>▼</span>
      <span class="pedal-label">Back</span>
    </button>
  </div>

  <!-- World JavaScript Engine -->
  <script src="script.js"></script>
</body>
</html>
